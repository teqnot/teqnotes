version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: editor-db
    environment:
      POSTGRES_DB: editor_db
      POSTGRES_USER: editor_user
      POSTGRES_PASSWORD: editor_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U editor_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: